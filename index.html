<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chọn Model Tài liệu (Bảo mật)</title>
    <style>
        /* Ẩn phần chọn model đi lúc đầu */
        #content {
            display: none;
            margin-top: 20px;
        }
        .error {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- PHẦN NHẬP MẬT KHẨU -->
    <div id="loginBox">
        <h2>Vui lòng nhập mật khẩu để tiếp tục</h2>
        <input type="password" id="passwordInput" placeholder="Nhập mật khẩu...">
        <button onclick="checkPassword()">Xác nhận</button>
        <p id="errorMsg" class="error"></p>
    </div>
    <h2>Chọn model AQUA để xem tài liệu</h2>

    <select id="modelSelect" onchange="showLink()">
        <option value="">-- Chọn Model --</option>
        <option value="https://vnexpress.net/">AW120-B2868B</option>
        <option value="https://drive.google.com/file/d/1klANtZkvvKTe2Spd-KCXVgPcxdB4YClF/view?usp=drive_link">GEA</option>
    </select>

    <p id="result"></p>

    <script>
        function showLink() {
            var select = document.getElementById("modelSelect");
            var result = document.getElementById("result");
            var link = select.value;

            if (link) {
                result.innerHTML = 'Bảng hướng dẫn: <a href="' + link + '" target="_blank">Xem</a>';
            } else {
                result.innerHTML = "";
            }
        }
    </script>
</body>
</html>
