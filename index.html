<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chọn Model Tài liệu (Bảo mật)</title>
    <style>
        /* Ẩn phần chọn model đi lúc đầu */
        #content {
            display: none;
            margin-top: 20px;
        }
        .error {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- PHẦN NHẬP MẬT KHẨU -->
    <div id="loginBox">
        <h2>Vui lòng nhập mật khẩu để tiếp tục</h2>
        <input type="password" id="passwordInput" placeholder="Nhập mật khẩu...">
        <button onclick="checkPassword()">Xác nhận</button>
        <p id="errorMsg" class="error"></p>
    </div>

    <!-- PHẦN NỘI DUNG TRANG WEB (BỊ ẨN KHI CHƯA NHẬP ĐÚNG MẬT KHẨU) -->
    <div id="content">
        <h2>Chọn Model để xem tài liệu</h2>

        <select id="modelSelect" onchange="showLink()">
            <option value="">-- Chọn Model --</option>
            <!-- Thay link Google Drive của bạn vào đây -->
            <option value="https://drive.google.com/file/d/1klANtZkvvKTe2Spd-KCXVgPcxdB4YClF/view?usp=drive_link">GEA Safety 1</option>
            <option value="https://drive.google.com/file/d/1x0BTGENxCVFoW7U45hUemh93Jx-UwJZ_/view?usp=drive_link">GEA Safety 2</option>
        </select>

        <p id="result"></p>
    </div>

    <script>
        // Đặt mật khẩu của bạn ở đây
        var matKhauDung = "123456"; 

        function checkPassword() {
            var inputVal = document.getElementById("passwordInput").value;
            var errorMsg = document.getElementById("errorMsg");
            var loginBox = document.getElementById("loginBox");
            var content = document.getElementById("content");

            if (inputVal === matKhauDung) {
                // Nếu đúng mật khẩu: ẩn ô đăng nhập, hiện phần chọn model lên
                loginBox.style.display = "none";
                content.style.display = "block";
            } else {
                // Nếu sai: hiện thông báo lỗi
                errorMsg.innerHTML = "Mật khẩu không đúng, vui lòng thử lại!";
            }
        }
    </script>
</body>
</html>
